<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои счётчики</title><style>body{font-family:system-ui;background:#f2f7f5;color:#18332e;margin:0}header{background:#176b62;color:white;padding:20px}main{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:20px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:8px;margin:5px 0;width:100%;box-sizing:border-box}input{border:1px solid #b8cbc5}button{border:0;background:#176b62;color:white}small{color:#647872}.hidden{display:none} .keypad{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(260px,calc(100vw - 24px));padding:12px;background:#fff;border:1px solid #c8d9d3;border-radius:16px;box-shadow:0 8px 32px #0003;z-index:20}.keypad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.keypad button{margin:0;min-height:43px;padding:7px;font-size:20px;background:#e5f0ec;color:#18332e;touch-action:manipulation}.keypad button.done{background:#176b62;color:white;font-size:15px}.keypad .caption{font-size:13px;margin-bottom:8px;text-align:center}.meter-input{cursor:pointer;transition:border-color .15s,box-shadow .15s,background-color .15s}.meter-input.editing{border:2px solid #e49a16!important;background:#fff8e7!important;box-shadow:0 0 0 3px #e49a1640;outline:none}.meter-input.editing+small{color:#94620b}.journal-table{width:100%;border-collapse:collapse;font-size:13px}.journal-table th,.journal-table td{padding:10px 5px;border-bottom:1px solid #dce7e2;text-align:right;white-space:nowrap}.journal-table th:first-child,.journal-table td:first-child{text-align:left}.journal-table tbody tr{cursor:pointer}.journal-table tbody tr:active{background:#e4f1eb}.journal-scroll{overflow-x:auto}.journal-nav{display:flex;align-items:center;gap:8px}.journal-nav button{width:auto;min-width:48px}.journal-nav strong{flex:1;text-align:center}.secondary{background:#e5f0ec;color:#18332e}.reading-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 15px}.reading-cell{min-width:0}.reading-cell small{display:block;margin:0 0 5px;font-size:12px}.reading-cell .reading-value{min-height:48px;display:flex;align-items:center;justify-content:center;background:#edf3f0;border:1px solid #b8cbc5;border-radius:8px;font-variant-numeric:tabular-nums;font-size:clamp(12px,3vw,18px);overflow-wrap:anywhere}.reading-cell input{margin:0;min-height:48px;padding:8px;text-align:center;font-variant-numeric:tabular-nums;font-size:clamp(12px,3vw,18px)}.reading-value.invalid{color:#b12b25;background:#fff0ee;border-color:#b12b25}.reading-value.positive{font-weight:600} </style></head><body><header><h2>Мои счётчики</h2></header><main><section class="card" id="config"><h3>Подключение к Supabase</h3><small>Только Project URL и публичный publishable/anon key. Не вводите секретные ключи.</small><input id="url" placeholder="https://project.supabase.co"><input id="key" type="password" placeholder="Публичный ключ"><button id="connect">Подключить</button></section><section class="card hidden" id="loginBox"><h3>Вход</h3><input id="email" type="email" placeholder="Электронная почта"><input id="password" type="password" placeholder="Пароль"><button id="login">Войти</button></section><section class="card hidden" id="journal"><h3>Журнал показаний</h3><div class="journal-nav"><button id="prevYear" class="secondary">‹</button><strong id="journalYear"></strong><button id="nextYear" class="secondary">›</button></div><div class="journal-scroll"><table class="journal-table"><thead><tr><th>Месяц</th><th>ХВС</th><th>ГВС</th><th>Электр.</th></tr></thead><tbody id="journalRows"></tbody></table></div><button id="openCurrent">Показания за текущий месяц</button><button id="journalLogout" class="secondary">Выйти</button></section><section class="card hidden" id="meters"><button id="backJournal" class="secondary">← Журнал</button><h3>Показания</h3><input type="month" id="period"><div id="fields"></div><div id="history"></div><button id="edit" class="hidden">Изменить показания</button><button id="save">Сохранить показания</button><button id="cancelEdit" class="hidden">Отменить изменения</button><button id="deleteReadings" class="hidden" style="background:#a83e36">Удалить показания за месяц</button><button id="logout">Выйти</button><small>Показания сохраняются в облаке, но не отправляются поставщикам.</small></section><p id="status" role="status"></p></main><div id="keypad" class="keypad hidden"><div id="keypad-title" class="caption">Введите показание</div><div class="keys" id="keys"></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const $=id=>document.getElementById(id),toggle=(id,show)=>$(id).classList.toggle('hidden',!show),say=s=>$('status').textContent=s;let db=null,list=[],saved=[];let requestNo=0,editing=false,journalYear=new Date().getFullYear();let activeInput=null;const keypad=$('keypad');function closeKeypad(){keypad.classList.add('hidden');if(activeInput)activeInput.classList.remove('editing');activeInput=null}for(const key of ['1','2','3','4','5','6','7','8','9',',','0','⌫','Готово']){const b=document.createElement('button');b.type='button';b.textContent=key;if(key==='Готово'){b.className='done';b.style.gridColumn='span 3'}b.addEventListener('click',()=>{if(key==='Готово')return closeKeypad();if(!activeInput)return;let v=activeInput.value;if(key==='⌫')v=v.slice(0,-1);else if(key===','){if(!v.includes(',')&&!v.includes('.'))v=(v||'0')+','}else if(v.replace(',','.').split('.')[1]?.length>=3)return;else v+=key;activeInput.value=v;activeInput.dispatchEvent(new Event('input',{bubbles:true}))});$('keys').append(b)}$('period').value=new Date().toISOString().slice(0,7);function init(){const url='https://fxgvswhipadpmmdmokyo.supabase.co',key='sb_publishable_dfQUtQ8yLi0y-fX-rHCx2w_LUgpRdEd';toggle('config',false);toggle('loginBox',true);db=createClient(url,key)}$('connect').onclick=()=>{let url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)||!key)return say('Проверьте URL и публичный ключ');localStorage.setItem('mm-url',url.replace(/\/$/,''));localStorage.setItem('mm-key',key);init()};$('login').onclick=async()=>{let{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return say(error.message);await load()};async function load(){let{data,error}=await db.from('meters').select('id,name,resource').eq('active',true).order('id');if(error)return say(error.message);list=data||[];toggle('loginBox',false);toggle('meters',false);toggle('journal',true);$('fields').replaceChildren();for(let m of list){let label=document.createElement('label');label.textContent=m.name;let input=document.createElement('input');input.inputMode='none';input.readOnly=true;input.className='meter-input';input.addEventListener('click',()=>{if(input.dataset.locked==='1')return;if(activeInput)activeInput.classList.remove('editing');activeInput=input;input.classList.add('editing');$('keypad-title').textContent=m.name;keypad.classList.remove('hidden')});input.placeholder='—';input.dataset.id=m.id;const grid=document.createElement('div');grid.className='reading-grid';const cell=(title,element)=>{const wrap=document.createElement('div');wrap.className='reading-cell';const cap=document.createElement('small');cap.textContent=title;wrap.append(cap,element);grid.append(wrap)};const previousValue=document.createElement('div');previousValue.className='reading-value';previousValue.id='previous-'+m.id;const usageValue=document.createElement('div');usageValue.className='reading-value';usageValue.id='usage-'+m.id;cell('Предыдущие',previousValue);cell('Текущие',input);cell('Расход',usageValue);input.addEventListener('input',()=>updateUsage(m));let hint=document.createElement('small');hint.id='hint-'+m.id;hint.style.display='block';hint.style.marginBottom='12px';$('fields').append(label,grid,hint)}$('period').addEventListener('change',refresh);await showJournal()}const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];async function showJournal(){closeKeypad();toggle('meters',false);toggle('journal',true);$('journalYear').textContent=journalYear+' год';$('journalRows').replaceChildren();say('Загрузка журнала…');const start=journalYear+'-01-01',end=(journalYear+1)+'-01-01';const {data,error}=await db.from('readings').select('meter_id,period,value').gte('period',start).lt('period',end).order('period',{ascending:true}).limit(1000);if(error)return say('Ошибка журнала: '+error.message);for(let i=0;i<12;i++){const p=journalYear+'-'+String(i+1).padStart(2,'0');const tr=document.createElement('tr');const vals=[months[i]];for(const resource of ['cold','hot','electric']){const meter=list.find(m=>m.resource===resource);const reading=(data||[]).find(r=>r.meter_id===meter?.id&&r.period.startsWith(p));vals.push(reading?String(reading.value).replace('.',','):'—')}for(const v of vals){const td=document.createElement('td');td.textContent=v;tr.append(td)}tr.addEventListener('click',async()=>{$('period').value=p;toggle('journal',false);toggle('meters',true);await refresh()});$('journalRows').append(tr)}say('Журнал за '+journalYear+' год')} $('prevYear').onclick=()=>{journalYear--;showJournal()};$('nextYear').onclick=()=>{journalYear++;showJournal()};$('openCurrent').onclick=async()=>{$('period').value=new Date().toLocaleDateString('sv-SE').slice(0,7);toggle('journal',false);toggle('meters',true);await refresh()};$('backJournal').onclick=showJournal;$('journalLogout').onclick=async()=>{await db.auth.signOut();toggle('journal',false);toggle('meters',false);toggle('loginBox',true)};
function updateUsage(m){const input=document.querySelector('[data-id="'+m.id+'"]');const usage=$('usage-'+m.id);const previous=$('previous-'+m.id);const raw=input.value.trim().replace(',','.');const prev=previous.dataset.value;usage.classList.remove('invalid','positive');if(!raw||!/^\d+(\.\d{0,3})?$/.test(raw)||raw.endsWith('.')||prev===''){usage.textContent='—';return}const diff=Number(raw)-Number(prev);usage.textContent=diff.toFixed(m.resource==='electric'?1:3).replace('.',',');usage.classList.add(diff<0?'invalid':'positive')}
async function refresh(){editing=false;toggle('cancelEdit',false);closeKeypad();const request=++requestNo;const period=$('period').value+'-01';for(const el of document.querySelectorAll('[data-id]')){el.value='';el.dataset.locked='1';$('hint-'+el.dataset.id).textContent='Загрузка показаний…'}$('history').textContent='';say('Загрузка за '+$('period').value+'…');if(!db||!list.length)return;const {data,error}=await db.from('readings').select('meter_id,period,value').lte('period',period).order('period',{ascending:false}).limit(1000);if(request!==requestNo)return;if(error){say('Ошибка загрузки показаний: '+error.message);for(const el of document.querySelectorAll('[data-id]'))$('hint-'+el.dataset.id).textContent='Не удалось загрузить показания';return}saved=data||[];let found=0;for(const m of list){const el=document.querySelector('[data-id="'+m.id+'"]');const current=saved.find(r=>r.meter_id===m.id&&r.period===period);const previous=saved.find(r=>r.meter_id===m.id&&r.period<period);el.value=current?String(current.value).replace('.',','):'';el.dataset.locked=current?'1':'0';if(current&&activeInput===el)closeKeypad();el.style.background=current?'#edf3f0':'white';const prevBox=$('previous-'+m.id);prevBox.dataset.value=previous?String(previous.value):'';prevBox.textContent=previous?String(previous.value).replace('.',','):'—';updateUsage(m);const hint=$('hint-'+m.id);hint.textContent=current?'Сохранено за выбранный месяц':previous?'Предыдущие за '+previous.period.slice(0,7):'Предыдущие показания отсутствуют';if(current)found++}toggle('deleteReadings',found>0);toggle('edit',found>0);$('edit').disabled=found===0;$('save').disabled=found===list.length;$('save').textContent='Сохранить показания';const history=$('history');history.textContent=found?'Сохранено приборов за месяц: '+found+' из '+list.length:'';say('Показания загружены за '+$('period').value)}
$('edit').onclick=()=>{editing=true;closeKeypad();for(const el of document.querySelectorAll('[data-id]'))el.dataset.locked='0';$('edit').classList.add('hidden');$('cancelEdit').classList.remove('hidden');$('save').disabled=false;$('save').textContent='Сохранить изменения';say('Режим исправления: выберите поле и введите новое показание')};$('cancelEdit').onclick=refresh;$('deleteReadings').onclick=async()=>{closeKeypad();const month=$('period').value;if(!month)return say('Выберите месяц');const existing=saved.filter(r=>r.period===month+'-01');if(!existing.length)return say('За этот месяц показаний нет');if(!confirm('Удалить '+existing.length+' показания за '+month+'? Это действие нельзя отменить.'))return;const {error}=await db.from('readings').delete().eq('period',month+'-01').in('meter_id',list.map(m=>m.id));if(error)return say('Ошибка удаления: '+error.message);await refresh();say('Показания за '+month+' удалены. Остальные месяцы не изменены')};
$('save').onclick=async()=>{closeKeypad();const period=$('period').value+'-01';const rows=[];for(const el of document.querySelectorAll('[data-id]')){const raw=el.value.trim().replace(',','.');if(!/^\d+(\.\d{1,3})?$/.test(raw)){const meter=list.find(m=>m.id===Number(el.dataset.id));return say('Проверьте показание: '+(meter?.name||'счётчик'))}rows.push({meter_id:Number(el.dataset.id),period,value:Number(raw)})}if(!rows.length)return say('Нет приборов');const existing=saved.filter(r=>r.period===period);if(!editing&&existing.length)return say('Этот месяц уже содержит показания. Используйте «Изменить показания»');const changed=rows.filter(row=>{const old=existing.find(x=>x.meter_id===row.meter_id);return !old||Number(old.value)!==row.value});if(!changed.length)return say('Изменений нет');const {data:neighbors,error:checkError}=await db.from('readings').select('meter_id,period,value').in('meter_id',list.map(m=>m.id)).order('period',{ascending:true}).limit(1000);if(checkError)return say('Ошибка проверки: '+checkError.message);for(const row of changed){const history=(neighbors||[]).filter(r=>r.meter_id===row.meter_id);const before=history.filter(r=>r.period<period).at(-1);const after=history.find(r=>r.period>period);if(before&&row.value<Number(before.value))return say('Показание меньше предыдущего: '+list.find(m=>m.id===row.meter_id).name);if(after&&row.value>Number(after.value))return say('Показание больше следующего: '+list.find(m=>m.id===row.meter_id).name)}if(!confirm(editing?'Сохранить исправления за '+$('period').value+'?':'Сохранить показания за '+$('period').value+'?'))return;const wasEditing=editing;const {error}=await db.from('readings').upsert(changed,{onConflict:'meter_id,period'});if(error)return say('Ошибка сохранения: '+error.message);await refresh();say('Показания успешно '+(wasEditing?'изменены':'сохранены'))};
$('logout').onclick=async()=>{closeKeypad();await db.auth.signOut();toggle('meters',false);toggle('journal',false);toggle('loginBox',true)};init();if(db){let{data}=await db.auth.getSession();if(data.session)await load()}</script></body></html>
