<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои счётчики</title><style>body{font-family:system-ui;background:#f2f7f5;color:#18332e;margin:0}header{background:#176b62;color:white;padding:20px}main{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:20px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:8px;margin:5px 0;width:100%;box-sizing:border-box}input{border:1px solid #b8cbc5}button{border:0;background:#176b62;color:white}small{color:#647872}.hidden{display:none}</style></head><body><header><h2>Мои счётчики</h2></header><main><section class="card" id="config"><h3>Подключение к Supabase</h3><small>Только Project URL и публичный publishable/anon key. Не вводите секретные ключи.</small><input id="url" placeholder="https://project.supabase.co"><input id="key" type="password" placeholder="Публичный ключ"><button id="connect">Подключить</button></section><section class="card hidden" id="loginBox"><h3>Вход</h3><input id="email" type="email" placeholder="Электронная почта"><input id="password" type="password" placeholder="Пароль"><button id="login">Войти</button></section><section class="card hidden" id="meters"><h3>Показания</h3><input type="month" id="period"><div id="fields"></div><div id="history"></div><button id="save">Сохранить показания</button><button id="logout">Выйти</button><small>Показания сохраняются в облаке, но не отправляются поставщикам.</small></section><p id="status" role="status"></p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const $=id=>document.getElementById(id),toggle=(id,show)=>$(id).classList.toggle('hidden',!show),say=s=>$('status').textContent=s;let db=null,list=[],saved=[];let requestNo=0;$('period').value=new Date().toISOString().slice(0,7);function init(){let url=localStorage.getItem('mm-url'),key=localStorage.getItem('mm-key');toggle('config',!url||!key);toggle('loginBox',!!url&&!!key);if(url&&key)db=createClient(url,key)}$('connect').onclick=()=>{let url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)||!key)return say('Проверьте URL и публичный ключ');localStorage.setItem('mm-url',url.replace(/\/$/,''));localStorage.setItem('mm-key',key);init()};$('login').onclick=async()=>{let{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return say(error.message);await load()};async function load(){let{data,error}=await db.from('meters').select('id,name,resource').eq('active',true).order('id');if(error)return say(error.message);list=data||[];toggle('loginBox',false);toggle('meters',true);$('fields').replaceChildren();for(let m of list){let label=document.createElement('label');label.textContent=m.name;let input=document.createElement('input');input.inputMode='decimal';input.placeholder=m.resource==='electric'?'кВт·ч':'м³';input.dataset.id=m.id;let hint=document.createElement('small');hint.id='hint-'+m.id;hint.style.display='block';hint.style.marginBottom='12px';$('fields').append(label,input,hint)}$('period').addEventListener('change',refresh);await refresh()}async function refresh(){const request=++requestNo;const period=$('period').value+'-01';if(!db||!list.length)return;const {data,error}=await db.from('readings').select('meter_id,period,value').order('period',{ascending:false}).limit(1000);if(request!==requestNo)return;if(error){say('Ошибка загрузки показаний: '+error.message);return}saved=data||[];let found=0;for(const m of list){const el=document.querySelector('[data-id="'+m.id+'"]');const current=saved.find(r=>r.meter_id===m.id&&r.period===period);const previous=saved.find(r=>r.meter_id===m.id&&r.period<period);el.value=current?String(current.value).replace('.',','):'';el.readOnly=!!current;el.style.background=current?'#edf3f0':'white';const hint=$('hint-'+m.id);hint.textContent=(current?'Сохранено за выбранный месяц. ':'За выбранный месяц показаний нет. ')+(previous?'Предыдущее: '+previous.value+' ('+previous.period.slice(0,7)+')'+(current?' · Расход: '+(Number(current.value)-Number(previous.value)).toFixed(m.resource==='electric'?1:3):''):'Предыдущие показания отсутствуют');if(current)found++}const history=$('history');history.textContent=found?'Сохранено приборов за месяц: '+found+' из '+list.length:'';say('Показания загружены за '+$('period').value)}
$('save').onclick=async()=>{let period=$('period').value+'-01',rows=[];for(let el of document.querySelectorAll('[data-id]')){let value=el.value.trim().replace(',','.');if(!/^\d+(\.\d{1,3})?$/.test(value))return say('Проверьте показания');rows.push({meter_id:Number(el.dataset.id),period,value:Number(value)})}if(!rows.length)return say('Нет приборов');if(saved.some(r=>r.period===period&&rows.some(x=>x.meter_id===r.meter_id)))return say('Показания за этот месяц уже сохранены. Повторное сохранение запрещено.');if(!confirm('Сохранить показания?'))return;let{error}=await db.from('readings').insert(rows);if(error)say('Ошибка: '+error.message);else await refresh()};$('logout').onclick=async()=>{await db.auth.signOut();toggle('meters',false);toggle('loginBox',true)};init();if(db){let{data}=await db.auth.getSession();if(data.session)await load()}</script></body></html>
